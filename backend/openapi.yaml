        - { $ref: '#/components/parameters/AdminId' }
      responses:
        '200':
          description: Published.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DestinationDetailEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /admin/event-sources:
    post:
      tags: [Admin]
      operationId: adminCreateEventSource
      summary: Register an approved event source
      description: Event imports use deterministic source-specific parsers (JSON-LD, RSS, CSS selectors, date rules), not an NLP model.
      x-required-role: ADMIN
      x-rate-limit-group: ADMINISTRATION
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventSourceRequest' }
      responses:
        '201':
          description: Source registered.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventSourceEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /admin/event-sources/{id}/imports:
    post:
      tags: [Admin]
      operationId: adminStartEventImport
      summary: Start an ingestion job
      description: Imported events stay PENDING_REVIEW until an administrator publishes them.
      x-required-role: ADMIN
      x-rate-limit-group: ADMINISTRATION
      parameters:
        - { $ref: '#/components/parameters/AdminId' }
      responses:
        '202':
          description: Job accepted.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventImportEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /admin/event-imports/{id}:
    get:
      tags: [Admin]
      operationId: adminGetEventImport
      summary: Job status and validation errors
      x-required-role: ADMIN
      x-rate-limit-group: ADMINISTRATION
      parameters:
        - { $ref: '#/components/parameters/AdminId' }
      responses:
        '200':
          description: Job.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventImportEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /admin/events/{id}:
    patch:
      tags: [Admin]
      operationId: adminUpdateEvent
      summary: Correct normalized event data
      x-required-role: ADMIN
      x-rate-limit-group: ADMINISTRATION
      parameters:
        - { $ref: '#/components/parameters/AdminId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminEventUpdateRequest' }
      responses:
        '200':
          description: Updated.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /admin/events/{id}/publish:
    post:
      tags: [Admin]
      operationId: adminPublishEvent
      summary: Publish a reviewed event
      x-required-role: ADMIN
      x-rate-limit-group: ADMINISTRATION
      parameters:
        - { $ref: '#/components/parameters/AdminId' }
      responses:
        '200':
          description: Published.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access JWT, at most 15 minutes. Claims sub, role, iat, exp, iss, aud. Roles USER and ADMIN.

  headers:
    XRequestId:
      description: Request correlation ID, always returned.
      schema: { type: string }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer, minimum: 0 }

  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque continuation token. Clients must not construct or parse it.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: One stable key per intended operation, reused for retries.
      schema: { type: string, minLength: 8, maxLength: 128 }
    Latitude:
      name: latitude
      in: query
      required: true
      schema: { type: number, format: double, minimum: -90, maximum: 90 }
    Longitude:
      name: longitude
      in: query
      required: true
      schema: { type: number, format: double, minimum: -180, maximum: 180 }
    RadiusMeters:
      name: radiusMeters
      in: query
      schema: { type: integer, minimum: 100, maximum: 50000, default: 5000 }
    From:
      name: from
      in: query
      description: Default range is now through the next 30 days.
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      schema: { type: string, format: date-time }
    DestinationId:
      name: destinationId
      in: path
      required: true
      schema: { type: string }
    LandmarkId:
      name: landmarkId
      in: path
      required: true
      schema: { type: string }
    VisitId:
      name: visitId
      in: path
      required: true
      schema: { type: string }
    PhotoId:
      name: photoId
      in: path
      required: true
      schema: { type: string }
    AlbumId:
      name: albumId
      in: path
      required: true
      schema: { type: string }
    RecapId:
      name: recapId
      in: path
      required: true
      schema: { type: string }
    AdminId:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Malformed request or unsupported query combination.
      headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing, expired or invalid authentication.
      headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Authenticated user is not allowed (for example USER calling an ADMIN route).
      headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource does not exist or is not visible to the caller.
      headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: State conflict, or an identical request is in progress (`REQUEST_IN_PROGRESS`, with `Retry-After`).
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PayloadTooLarge:
      description: Upload exceeds the allowed limit.
      headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnsupportedMediaType:
      description: Unsupported media type (only image/jpeg and image/png).
      headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unprocessable:
      description: Valid syntax but violates validation or business rules (for example IDEMPOTENCY_KEY_REUSED, ARRIVAL_REQUIRED, RECOGNITION_REQUIRED, LANDMARK_LOCKED, STICKER_NOT_AVAILABLE).
      headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: Unexpected server error without internal details.
      headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: A required dependency is temporarily unavailable (AI inference).
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    # ---- shared ----
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                required: [reason]
                properties:
                  field: { type: string }
                  reason: { type: string }
            requestId: { type: string }
    Pagination:
      type: object
      required: [nextCursor, hasMore]
      properties:
        nextCursor: { type: string, nullable: true }
        hasMore: { type: boolean }
    GeoPoint:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
    LocationPrecision:
      type: string
      description: APPROXIMATE is generalized by the server; the transformation is not a client contract.
      enum: [NONE, DESTINATION, DISTRICT, APPROXIMATE, EXACT]
    AlbumLocationPrecision:
      type: string
      enum: [NONE, DESTINATION, DISTRICT]
    ProcessingStatus:
      type: string
      enum: [PENDING, PROCESSING, READY, FAILED]
    VisitStatus:
      type: string
      description: ENDED is terminal; there is no cancelled state.
      enum: [ACTIVE, PAUSED, ENDED]
    DestinationArea:
      type: string
      enum: [CENTRAL, WEST, NORTH, OUTSKIRTS]
    AlbumKind:
      type: string
      enum: [DESTINATION, JOURNEY]
    RecapType:
      type: string
      enum: [DESTINATION, MONTHLY]
    AlbumLayout:
      type: string
      enum: [TIMELINE, BY_DESTINATION, POSTCARD, FILM]
    NamedRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    # ---- auth / profile ----
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 10, maxLength: 128 }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        locale: { type: string, example: vi-VN }
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    RefreshRequest:
      type: object
      required: [refreshToken]
      additionalProperties: false
      properties:
        refreshToken: { type: string, description: Opaque; stored hashed by the backend. }
    TokenPair:
      type: object
      required: [accessToken, expiresAt, refreshToken]
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
        refreshToken: { type: string }
    TokenEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/TokenPair' }
    User:
      type: object
      required: [id, displayName, email, locale, defaultLocationPrecision, autoJourneyAlbum, createdAt]
      properties:
        id: { type: string, example: usr_01 }
        displayName: { type: string }
        email: { type: string, format: email }
        locale: { type: string, example: vi-VN }
        defaultLocationPrecision: { $ref: '#/components/schemas/LocationPrecision' }
        autoJourneyAlbum: { type: boolean, default: true }
        createdAt: { type: string, format: date-time }
    UserEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/User' }
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        locale: { type: string }
        defaultLocationPrecision: { $ref: '#/components/schemas/LocationPrecision' }
        autoJourneyAlbum: { type: boolean }

    # ---- destinations ----
    DestinationSummary:
      type: object
      required: [id, slug, name, area, district, summary]
      properties:
        id: { type: string, example: dst_van_mieu }
        slug: { type: string }
        name: { type: string }
        area: { $ref: '#/components/schemas/DestinationArea' }
        district: { type: string }
        summary: { type: string }
        coverImageUrl: { type: string, format: uri, nullable: true, description: Short-lived signed URL. }
        bestTime: { type: string, example: EARLY_MORNING }
        estimatedMinutes: { type: integer }
        landmarkCount: { type: integer }
        distanceMeters: { type: integer, nullable: true, description: Present on nearby queries only. }
        isFeatured: { type: boolean }
    DestinationPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DestinationSummary' }
        pagination: { $ref: '#/components/schemas/Pagination' }
    Geofence:
      type: object
      required: [type, center, radiusMeters]
      properties:
        type: { type: string, enum: [CIRCLE] }
        center: { $ref: '#/components/schemas/GeoPoint' }
        radiusMeters: { type: integer, minimum: 1 }
    DestinationDetail:
      allOf:
        - $ref: '#/components/schemas/DestinationSummary'
        - type: object
          properties:
            description: { type: string }
            geofence: { $ref: '#/components/schemas/Geofence' }
            aiFeatures:
              type: object
              properties:
                historicalRagAvailable: { type: boolean }
                landmarkRecognitionAvailable: { type: boolean }
    DestinationDetailEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/DestinationDetail' }
    Landmark:
      type: object
      required: [id, destinationId, name]
      properties:
        id: { type: string, example: lmk_khue_van_cac }
        destinationId: { type: string }
        name: { type: string }
        summary: { type: string }
        description: { type: string }
        imageUrl: { type: string, format: uri, nullable: true }
        position: { $ref: '#/components/schemas/GeoPoint' }
        destination: { $ref: '#/components/schemas/NamedRef' }
    LandmarkPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Landmark' }
        pagination: { $ref: '#/components/schemas/Pagination' }
    LandmarkEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Landmark' }
    ArrivalCheckRequest:
      type: object
      required: [position, accuracyMeters, observedAt]
      additionalProperties: false
      properties:
        position: { $ref: '#/components/schemas/GeoPoint' }
        accuracyMeters: { type: number, minimum: 0 }
        observedAt: { type: string, format: date-time }
    ArrivalCheck:
      type: object
      required: [id, destinationId, status, canStartVisit, checkedAt]
      properties:
        id: { type: string, example: arr_01 }
        destinationId: { type: string }
        status: { type: string, enum: [OUTSIDE, NEARBY, INSIDE, INDETERMINATE] }
        distanceMeters: { type: integer }
        accuracyMeters: { type: number }
        canStartVisit: { type: boolean }
        checkedAt: { type: string, format: date-time }
    ArrivalCheckEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ArrivalCheck' }
    # ---- events ----
    EventVenue:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        district: { type: string }
        position: { $ref: '#/components/schemas/GeoPoint' }
    Event:
      type: object
      required: [id, title, startsAt, endsAt, timezone, status]
      properties:
        id: { type: string, example: evt_01 }
        title: { type: string }
        summary: { type: string }
        venue: { $ref: '#/components/schemas/EventVenue' }
        destinationId: { type: string, nullable: true }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        timezone: { type: string, example: Asia/Ho_Chi_Minh }
        sourceUrl: { type: string, format: uri }
        lastVerifiedAt: { type: string, format: date-time }
        status: { type: string, enum: [SCHEDULED, ONGOING, ENDED, CANCELLED] }
    EventEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Event' }
    EventPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    # ---- visits ----
    StartVisitRequest:
      type: object
      required: [destinationId, arrivalCheckId, locationPrecision]
      additionalProperties: false
      properties:
        destinationId: { type: string }
        arrivalCheckId: { type: string }
        locationPrecision: { $ref: '#/components/schemas/LocationPrecision' }
    Visit:
      type: object
      required: [id, destination, status, startedAt, locationPrecision, createdAt, updatedAt]
      properties:
        id: { type: string, example: vst_01 }
        destination: { $ref: '#/components/schemas/NamedRef' }
        status: { $ref: '#/components/schemas/VisitStatus' }
        startedAt: { type: string, format: date-time }
        pausedAt: { type: string, format: date-time, nullable: true }
        endedAt: { type: string, format: date-time, nullable: true }
        unlockedLandmarkCount: { type: integer }
        landmarkCount: { type: integer }
        photoCount: { type: integer }
        locationPrecision: { $ref: '#/components/schemas/LocationPrecision' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StampRef:
      type: object
      required: [id, kind]
      properties:
        id: { type: string }
        kind: { type: string, enum: [HERITAGE, LANDMARK] }
        landmarkId: { type: string, nullable: true }
        artworkUrl: { type: string, format: uri }
    VisitEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Visit' }
    NullableVisitEnvelope:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/Visit'
          nullable: true
    StartVisitEnvelope:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/Visit'
            - type: object
              properties:
                stampCollected:
                  allOf:
                    - $ref: '#/components/schemas/StampRef'
                  nullable: true
    VisitPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Visit' }
        pagination: { $ref: '#/components/schemas/Pagination' }
    VisitLandmark:
      type: object
      required: [landmarkId, unlockedAt]
      properties:
        landmarkId: { type: string }
        recognitionId: { type: string }
        unlockedAt: { type: string, format: date-time }
    VisitDetail:
      allOf:
        - $ref: '#/components/schemas/Visit'
        - type: object
          properties:
            landmarks:
              type: array
              items: { $ref: '#/components/schemas/VisitLandmark' }
            photos:
              type: array
              items: { $ref: '#/components/schemas/PhotoSummary' }
    VisitDetailEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/VisitDetail' }
    EndVisitRequest:
      type: object
      additionalProperties: false
      properties:
        endedAt: { type: string, format: date-time }
        note: { type: string, maxLength: 500 }
    EndVisitEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [visit, recap]
          properties:
            visit:
              type: object
              required: [id, status, endedAt]
              properties:
                id: { type: string }
                status: { $ref: '#/components/schemas/VisitStatus' }
                endedAt: { type: string, format: date-time }
            recap:
              type: object
              nullable: true
              description: Null when the profile setting autoJourneyAlbum is false.
              required: [id, status]
              properties:
                id: { type: string }
                status: { $ref: '#/components/schemas/ProcessingStatus' }
    UnlockLandmarkRequest:
      type: object
      required: [recognitionId]
      additionalProperties: false
      properties:
        recognitionId: { type: string, example: rec_01 }
    UnlockLandmarkEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [landmark]
          properties:
            landmark: { $ref: '#/components/schemas/Landmark' }
            stampCollected:
              allOf:
                - $ref: '#/components/schemas/StampRef'
              nullable: true
    StampCollectionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            required: [destination, heritageStamp, landmarkStamps]
            properties:
              destination: { $ref: '#/components/schemas/NamedRef' }
              heritageStamp: { $ref: '#/components/schemas/CollectedStamp' }
              landmarkStamps:
                type: array
                items: { $ref: '#/components/schemas/CollectedStamp' }
    CollectedStamp:
      type: object
      required: [id, collected]
      properties:
        id: { type: string }
        landmarkId: { type: string, nullable: true }
        collected: { type: boolean }
        collectedAt: { type: string, format: date-time, nullable: true }
        artworkUrl: { type: string, format: uri }

    # ---- media ----
    CreateUploadRequest:
      type: object
      required: [visitId, fileName, contentType, sizeBytes, sha256]
      additionalProperties: false
      properties:
        visitId: { type: string }
        fileName: { type: string, maxLength: 255, description: Metadata only; never a storage path. }
        contentType: { type: string, enum: [image/jpeg, image/png] }
        sizeBytes: { type: integer, minimum: 1, maximum: 26214400, description: Default maximum 25 MB. }
        sha256: { type: string, description: Base64-encoded SHA-256 of the file. }
        capturedAt: { type: string, format: date-time }
        locationPrecision: { $ref: '#/components/schemas/LocationPrecision' }
    UploadSession:
      type: object
      required: [uploadId, uploadUrl, method, requiredHeaders, expiresAt]
      properties:
        uploadId: { type: string, example: upl_01 }
        uploadUrl: { type: string, format: uri, description: Presigned, single-key, single PUT; expires within 5-10 minutes. Never logged. }
        method: { type: string, enum: [PUT] }
        requiredHeaders:
          type: object
          additionalProperties: { type: string }
        expiresAt: { type: string, format: date-time }
    UploadSessionEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/UploadSession' }
    CompleteUploadRequest:
      type: object
      additionalProperties: false
      properties:
        etag: { type: string, description: Storage ETag if available. }
    PhotoSummary:
      type: object
      required: [id, status]
      properties:
        id: { type: string, example: pht_01 }
        status: { $ref: '#/components/schemas/ProcessingStatus' }
        capturedAt: { type: string, format: date-time }
        thumbnailUrl: { type: string, format: uri, nullable: true }
    PhotoVariant:
      type: object
      required: [id, kind, status]
      properties:
        id: { type: string, example: var_01 }
        kind: { type: string, enum: [THUMBNAIL, PREVIEW, EDIT] }
        status: { $ref: '#/components/schemas/ProcessingStatus' }
        url: { type: string, format: uri, nullable: true, description: Short-lived signed URL, EXIF stripped. }
    PhotoVariantEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/PhotoVariant' }
    Photo:
      type: object
      required: [id, visitId, status, locationPrecision]
      properties:
        id: { type: string }
        visitId: { type: string }
        status: { $ref: '#/components/schemas/ProcessingStatus' }
        caption: { type: string, nullable: true }
        landmarkId: { type: string, nullable: true }
        capturedAt: { type: string, format: date-time }
        locationPrecision: { $ref: '#/components/schemas/LocationPrecision' }
        location:
          allOf:
            - $ref: '#/components/schemas/GeoPoint'
          nullable: true
          description: Present only as allowed by locationPrecision; never original EXIF GPS.
        techniqueTags:
          type: array
          items: { type: string }
        variants:
          type: array
          items: { $ref: '#/components/schemas/PhotoVariant' }
    PhotoEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Photo' }
    PhotoPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Photo' }
        pagination: { $ref: '#/components/schemas/Pagination' }
    UpdatePhotoRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        caption: { type: string, maxLength: 280 }
        landmarkId: { type: string, nullable: true }
        locationPrecision: { $ref: '#/components/schemas/LocationPrecision' }
        techniqueTags:
          type: array
          items: { type: string }
    EditLayer:
      type: object
      required: [x, y]
      properties:
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        scale: { type: number, minimum: 0.2, maximum: 3, default: 1 }
        rotationDegrees: { type: number, minimum: -180, maximum: 180, default: 0 }
    Sticker:
      allOf:
        - $ref: '#/components/schemas/EditLayer'
        - type: object
          required: [stickerId]
          properties:
            stickerId: { type: string }
            text: { type: string, maxLength: 40 }
    Caption:
      allOf:
        - $ref: '#/components/schemas/EditLayer'
        - type: object
          required: [text, fontId]
          properties:
            text: { type: string, maxLength: 80 }
            fontId: { type: string }
            color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
    PhotoEditRequest:
      type: object
      additionalProperties: false
      properties:
        crop:
          type: object
          required: [x, y, width, height]
          properties:
            x: { type: number, minimum: 0, maximum: 1 }
            y: { type: number, minimum: 0, maximum: 1 }
            width: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 1 }
            height: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 1 }
        rotationDegrees: { type: number, minimum: -180, maximum: 180 }
        adjustments:
          type: object
          properties:
            exposure: { type: number, minimum: -1, maximum: 1 }
            highlights: { type: number, minimum: -1, maximum: 1 }
            shadows: { type: number, minimum: -1, maximum: 1 }
            temperature: { type: number, minimum: -1, maximum: 1 }
        colorPreset: { type: string, description: ID from GET /edit-presets, applied before manual adjustments. }
        stickers:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Sticker' }
        captions:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/Caption' }
    PhotoExportRequest:
      type: object
      required: [style, locationPrecision, format]
      additionalProperties: false
      properties:
        sourceVariantId: { type: string }
        style: { type: string, example: POSTCARD }
        fields:
          type: array
          items: { type: string, enum: [DESTINATION, DISTRICT, CAPTURED_AT, WEATHER] }
        locationPrecision: { $ref: '#/components/schemas/LocationPrecision' }
        format: { type: string, enum: [JPEG] }
        quality: { type: integer, minimum: 1, maximum: 100, default: 90 }
    Export:
      type: object
      required: [id, status]
      properties:
        id: { type: string, example: exp_01 }
        status: { $ref: '#/components/schemas/ProcessingStatus' }
        statusUrl: { type: string }
        downloadUrl: { type: string, format: uri, nullable: true, description: Short-lived; present when READY. }
        expiresAt: { type: string, format: date-time, nullable: true }
    ExportEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Export' }
    StickerEntry:
      type: object
      required: [id, type, imageUrl, allowsText]
      properties:
        id: { type: string }
        type: { type: string, enum: [STAMP, POSTMARK, DATE, TEXT, HEART, BADGE] }
        imageUrl: { type: string, format: uri }
        allowsText: { type: boolean }
        landmarkId: { type: string, nullable: true }
        available: { type: boolean, description: For landmark stamps, whether the caller unlocked the landmark. }
    StickerListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/StickerEntry' }
    EditPresetsEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [colorPresets, captionFonts]
          properties:
            colorPresets:
              type: array
              items: { $ref: '#/components/schemas/PresetEntry' }
            captionFonts:
              type: array
              items: { $ref: '#/components/schemas/PresetEntry' }
    PresetEntry:
      type: object
      required: [id, name, previewUrl]
      properties:
        id: { type: string }
        name: { type: string }
        previewUrl: { type: string, format: uri }

    # ---- albums / recaps ----
    CreateAlbumRequest:
      type: object
      required: [title, visitIds, photoIds, layout, locationPrecision]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        visitIds:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string }
        photoIds:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string }
        layout: { $ref: '#/components/schemas/AlbumLayout' }
        locationPrecision: { $ref: '#/components/schemas/AlbumLocationPrecision' }
    UpdateAlbumRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        layout: { $ref: '#/components/schemas/AlbumLayout' }
        photoIds:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string }
    AlbumExportRequest:
      type: object
      required: [format]
      additionalProperties: false
      properties:
        format: { type: string, enum: [JPEG_ZIP, PDF] }
    AlbumCreatedEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, kind, status, statusUrl]
          properties:
            id: { type: string, example: alb_01 }
            kind: { $ref: '#/components/schemas/AlbumKind' }
            status: { $ref: '#/components/schemas/ProcessingStatus' }
            statusUrl: { type: string, example: /v1/albums/alb_01 }
    AlbumSection:
      type: object
      required: [destination, photos]
      properties:
        destination:
          type: object
          required: [name]
          properties:
            name: { type: string }
        capturedAt: { type: string, format: date-time }
        photos:
          type: array
          items:
            type: object
            required: [photoId, imageUrl]
            properties:
              photoId: { type: string }
              imageUrl: { type: string, format: uri }
    Album:
      type: object
      required: [id, kind, status]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/AlbumKind' }
        title: { type: string }
        status: { $ref: '#/components/schemas/ProcessingStatus' }
        layout: { $ref: '#/components/schemas/AlbumLayout' }
        locationPrecision: { $ref: '#/components/schemas/AlbumLocationPrecision' }
        visitIds:
          type: array
          items: { type: string }
        photos:
          type: array
          items: { $ref: '#/components/schemas/PhotoSummary' }
        sections:
          type: array
          description: Present for JOURNEY albums when READY.
          items: { $ref: '#/components/schemas/AlbumSection' }
        createdAt: { type: string, format: date-time }
    AlbumEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Album' }
    AlbumPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Album' }
        pagination: { $ref: '#/components/schemas/Pagination' }
    Recap:
      type: object
      required: [id, type, status]
      properties:
        id: { type: string, example: rcp_01 }
        type: { $ref: '#/components/schemas/RecapType' }
        status: { $ref: '#/components/schemas/ProcessingStatus' }
        destination: { $ref: '#/components/schemas/NamedRef' }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        summary: { type: string }
        photoCount: { type: integer }
        photos:
          type: array
          items:
            type: object
            required: [photoId, position, imageUrl]
            properties:
              photoId: { type: string }
              position: { type: integer, minimum: 1 }
              imageUrl: { type: string, format: uri }
        createdAt: { type: string, format: date-time }
        readyAt: { type: string, format: date-time, nullable: true }
    RecapEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Recap' }
    RecapPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Recap' }
        pagination: { $ref: '#/components/schemas/Pagination' }
    UpdateRecapRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, maxLength: 120 }
        note: { type: string, maxLength: 500 }
        photoIds:
          type: array
          maxItems: 50
          items: { type: string }

    # ---- AI ----
    RecognizeLandmarkRequest:
      type: object
      required: [photoId]
      additionalProperties: false
      properties:
        photoId: { type: string }
    Recognition:
      type: object
      required: [id, result, confidence]
      properties:
        id: { type: string, example: rec_01, description: Used as recognitionId when unlocking a landmark. }
        landmarkId: { type: string, nullable: true, description: Null when result is UNKNOWN. }
        confidence: { type: number, minimum: 0, maximum: 1 }
        result: { type: string, enum: [RECOGNIZED, UNKNOWN] }
    RecognitionEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Recognition' }
    QaRequest:
      type: object
      required: [destinationId, question]
      additionalProperties: false
      properties:
        destinationId: { type: string }
        landmarkId: { type: string, description: Optional focus; must be unlocked by the caller. }
        question: { type: string, minLength: 1, maxLength: 1000 }
        locale: { type: string, example: en-US }
    QaAnswer:
      type: object
      required: [answer, sources, isAiGenerated, generatedAt]
      properties:
        answer: { type: string }
        sources:
          type: array
          items:
            type: object
            required: [title]
            properties:
              title: { type: string }
              url: { type: string, format: uri }
        isAiGenerated: { type: boolean }
        generatedAt: { type: string, format: date-time }
    QaEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/QaAnswer' }

    # ---- admin ----
    AdminDestinationRequest:
      type: object
      additionalProperties: false
      properties:
        slug: { type: string }
        name: { type: string }
        area: { $ref: '#/components/schemas/DestinationArea' }
        district: { type: string }
        summary: { type: string }
        description: { type: string }
        geofence: { $ref: '#/components/schemas/Geofence' }
        estimatedMinutes: { type: integer }
        isFeatured: { type: boolean }
    EventSourceRequest:
      type: object
      required: [name, url, parserType]
      additionalProperties: false
      properties:
        name: { type: string }
        url: { type: string, format: uri }
        parserType: { type: string, enum: [JSON_LD, RSS, CSS_SELECTOR] }
        parserConfig: { type: object, additionalProperties: true }
    EventSourceEnvelope:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/EventSourceRequest'
            - type: object
              required: [id]
              properties:
                id: { type: string }
    EventImportEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, status]
          properties:
            id: { type: string }
            sourceId: { type: string }
            status: { $ref: '#/components/schemas/ProcessingStatus' }
            importedCount: { type: integer }
            validationErrors:
              type: array
              items:
                type: object
                required: [reason]
                properties:
                  field: { type: string }
                  reason: { type: string }
    AdminEventUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        title: { type: string }
        summary: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        timezone: { type: string }
        destinationId: { type: string, nullable: true }
        sourceUrl: { type: string, format: uri }
