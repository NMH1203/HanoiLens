      operationId: createAlbumExport
      summary: Export a READY album
      description: |
        Requires `Idempotency-Key`. Exported files have GPS and device EXIF stripped and show location only at the album's
        `locationPrecision`. Ownership: another user's album returns 404; a non-READY album is `409`.
