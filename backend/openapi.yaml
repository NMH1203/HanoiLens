        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /albums/{albumId}:
    get:
      tags: [Albums]
      operationId: getAlbum
      summary: Album metadata, visits and ordered photos
      description: "Ownership: another user's album returns 404. Image URLs are short-lived signed URLs."
      parameters:
        - { $ref: '#/components/parameters/AlbumId' }
      responses:
        '200':
          description: Album.
