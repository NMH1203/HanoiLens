        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Albums]
      operationId: updateAlbum
      summary: Update title, layout or ordered photos of a JOURNEY album
      description: |
        Layout or photo changes return `202` and recompose; a title-only change returns `200`.
        `DESTINATION` albums are read-only (`409 ALBUM_READ_ONLY`). Ownership: another user's album returns 404.
      parameters:
        - { $ref: '#/components/parameters/AlbumId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAlbumRequest' }
      responses:
        '200':
          description: Updated.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlbumEnvelope' }
        '202':
          description: Recomposition started.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlbumCreatedEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Albums]
      operationId: deleteAlbum
      summary: Delete a JOURNEY album and its derived assets
      description: "Original photos are never deleted. Ownership: owner only. `DESTINATION` albums return 409 ALBUM_READ_ONLY."
      parameters:
        - { $ref: '#/components/parameters/AlbumId' }
      responses:
