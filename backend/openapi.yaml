    post:
      tags: [AI]
      operationId: recognizeLandmark
      summary: Landmark image classification (Model 1)
      description: |
        Runs against a private photo owned by the caller (another user's photo returns 404). Below the confidence
        threshold the result is `UNKNOWN` with `landmarkId` null; a landmark is never silently chosen. No bounding boxes
        or live camera analysis. Exact coordinates are never sent to the AI runtime. The result `id` is the
        `recognitionId` used by `PUT /visits/{visitId}/landmarks/{landmarkId}`.
      x-rate-limit-group: AI_INFERENCE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecognizeLandmarkRequest' }
      responses:
        '200':
          description: Recognition result.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecognitionEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
