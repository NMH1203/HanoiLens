openapi: 3.0.3
info:
  title: Hanoi Lens REST API
  version: 1.0.0
  description: |
    Contract for the Hanoi Lens MVP, converted from `docs/API.md` (task T01).
    The backend is one Spring Boot modular monolith; the module that owns each tag is noted in the tag description.

    Conventions
    - Base path `/v1`; JSON `camelCase`; enums `UPPER_SNAKE_CASE`; opaque string IDs; ISO 8601 UTC timestamps.
    - Success envelope `{ "data": ... }`; collections add `pagination`. Every non-success response uses `ErrorResponse`.
    - `X-Request-Id` is returned on every response.
    - `Idempotency-Key` is required where the operation lists it. Same key + same request replays the result;
      same key + different request is `422 IDEMPOTENCY_KEY_REUSED`; same key while running is `409 REQUEST_IN_PROGRESS` with `Retry-After`.
    - Private resources: every operation marked "Ownership" filters by the authenticated user. A resource of another user
      is reported as `404` so that existence does not leak. Clients cannot set `ownerId`, role, object key or status.
    - Privacy: exact coordinates are used for the request only and are not stored or logged; derived and exported images
      never carry GPS or device EXIF; location in responses follows `LocationPrecision`.
    - Rate-limit groups (headers `RateLimit-*`, `Retry-After`): public discovery (high), location (medium), media (lower),
      AI inference (low), authentication (strict), administration (strict). Operations carry `x-rate-limit-group`.
    - Async resources (`PENDING|PROCESSING|READY|FAILED`) are polled with 1, 2, 4, 8 s backoff and respect `Retry-After`.
servers:
  - url: https://api.hanoilens.example/v1
    description: Production
  - url: https://api.staging.hanoilens.example/v1
    description: Staging
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: identity module. Access JWT (<= 15 min) and rotating opaque refresh token.
  - name: Profile
    description: profile module.
  - name: Destinations
    description: destination module. Heritages, landmarks, arrival checks, stamps catalogue.
  - name: Events
    description: event module. Published cultural events only.
  - name: Visits
    description: visit module. One visit covers one heritage; at most one ACTIVE or PAUSED visit per user.
  - name: Media
    description: media module. Uploads, photos, edits, exports, stickers.
  - name: Albums
    description: recap module. Albums, recaps and album exports.
  - name: AI
    description: Landmark recognition (media) and historical RAG (destination). Exactly two AI capabilities.
  - name: Admin
    description: Role ADMIN only, audited. Imported content stays PENDING_REVIEW until published.

paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Create a USER account
      description: Allowlisted registration DTO. Clients cannot assign roles or account status.
      security: []
      x-rate-limit-group: AUTHENTICATION
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: Exchange credentials for tokens
      description: Failures return one generic message and are strictly rate-limited.
      security: []
      x-rate-limit-group: AUTHENTICATION
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Token pair.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Rotate the refresh token
      description: The submitted refresh token is invalidated immediately. Reuse revokes the token family and requires a new login.
      security: []
      x-rate-limit-group: AUTHENTICATION
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logoutUser
      summary: Revoke the current refresh-token family
      x-rate-limit-group: AUTHENTICATION
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204':
          description: Logged out.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /me:
    get:
      tags: [Profile]
      operationId: getMe
      summary: Authenticated user and profile
      description: "Ownership: returns only the caller."
      responses:
        '200':
          description: The user.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Profile]
      operationId: updateMe
      summary: Update supplied profile fields
      description: |
        Ownership: updates only the caller. `autoJourneyAlbum` (default true) controls whether ending a visit creates the
        automatic journey album (DESTINATION recap).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Updated user.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /me/stamps:
    get:
      tags: [Visits]
      operationId: listMyStamps
      summary: Stamp collection grouped by destination
      description: "Ownership: owner only. Stamps are collectibles; there are no badges or gifts."
      responses:
        '200':
          description: Collection.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StampCollectionEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /destinations:
    get:
      tags: [Destinations]
      operationId: listDestinations
      summary: List published destinations
      security: []
      x-rate-limit-group: PUBLIC_DISCOVERY
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - name: area
          in: query
          schema: { $ref: '#/components/schemas/DestinationArea' }
        - name: district
          in: query
          description: Exact normalized district identifier.
          schema: { type: string }
        - name: isFeatured
          in: query
          schema: { type: boolean }
        - name: search
          in: query
          description: Free-text name or summary search.
          schema: { type: string, maxLength: 100 }
        - name: sort
          in: query
          schema: { type: string, enum: [FEATURED, NAME, NEWEST], default: FEATURED }
      responses:
        '200':
          description: Cursor-paginated destination summaries.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DestinationPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /destinations/nearby:
    get:
      tags: [Destinations]
      operationId: listNearbyDestinations
      summary: Destinations ordered by distance from a point
      description: Privacy - coordinates are used for the query and are not retained as visit history or logged.
      security: []
      x-rate-limit-group: LOCATION
      parameters:
        - { $ref: '#/components/parameters/Latitude' }
        - { $ref: '#/components/parameters/Longitude' }
        - { $ref: '#/components/parameters/RadiusMeters' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Cursor-paginated destinations with `distanceMeters`.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DestinationPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /destinations/{destinationId}:
    get:
      tags: [Destinations]
      operationId: getDestination
      summary: Destination details
      description: |
        Used by the heritage preview (always shows the historical RAG entry point) and the on-site heritage explore page.
      security: []
      x-rate-limit-group: PUBLIC_DISCOVERY
      parameters:
        - { $ref: '#/components/parameters/DestinationId' }
      responses:
        '200':
          description: Destination.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DestinationDetailEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /destinations/{destinationId}/landmarks:
    get:
      tags: [Destinations]
      operationId: listDestinationLandmarks
      summary: Published landmarks of a destination
      description: Ordering is editorial, not a required route.
      security: []
      x-rate-limit-group: PUBLIC_DISCOVERY
      parameters:
        - { $ref: '#/components/parameters/DestinationId' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Landmarks.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LandmarkPage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /landmarks/{landmarkId}:
    get:
      tags: [Destinations]
      operationId: getLandmark
      summary: Cultural information for one landmark
      description: Feeds the landmark info screen after a RECOGNIZED result.
      security: []
      x-rate-limit-group: PUBLIC_DISCOVERY
      parameters:
        - { $ref: '#/components/parameters/LandmarkId' }
      responses:
        '200':
          description: Landmark with parent destination.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LandmarkEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /destinations/{destinationId}/arrival-checks:
    post:
      tags: [Destinations]
      operationId: createArrivalCheck
      summary: Check a device position against the destination geofence
      description: |
        Authentication required. The raw coordinate is not stored or logged after evaluation. A successful `INSIDE`
        result with `canStartVisit=true` yields a short-lived, one-time `id` used by `POST /visits`.
      x-rate-limit-group: LOCATION
      parameters:
        - { $ref: '#/components/parameters/DestinationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArrivalCheckRequest' }
      responses:
        '200':
          description: Arrival result.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArrivalCheckEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: Published events ordered by startsAt, then id
      security: []
      x-rate-limit-group: PUBLIC_DISCOVERY
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - name: status
          in: query
          schema: { type: string, enum: [ONGOING, UPCOMING, ENDED] }
        - name: district
          in: query
          schema: { type: string }
        - name: destinationId
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Events.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /events/nearby:
    get:
      tags: [Events]
      operationId: listNearbyEvents
      summary: Events near a point
      description: Coordinates are not stored or logged.
      security: []
      x-rate-limit-group: LOCATION
      parameters:
        - { $ref: '#/components/parameters/Latitude' }
        - { $ref: '#/components/parameters/Longitude' }
        - { $ref: '#/components/parameters/RadiusMeters' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Events.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /events/{eventId}:
    get:
      tags: [Events]
      operationId: getEvent
      summary: Event with source provenance
      description: Clients must display the event source and verification time.
      security: []
      x-rate-limit-group: PUBLIC_DISCOVERY
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Event.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /visits:
    post:
      tags: [Visits]
      operationId: createVisit
      summary: Start a visit and unlock the heritage
      description: |
        Requires `Idempotency-Key`. Called automatically after an arrival check returns INSIDE with `canStartVisit=true`.
        The first visit to a heritage also collects its heritage stamp (`stampCollected`; null if already owned).
        Errors: `409 ACTIVE_VISIT_EXISTS`, `422 ARRIVAL_REQUIRED`, `422 ARRIVAL_CHECK_EXPIRED`.
        Ownership: the arrival check must belong to the caller.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartVisitRequest' }
      responses:
        '201':
          description: Visit created.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartVisitEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Visits]
      operationId: listVisits
      summary: The caller's visits, startedAt descending
      description: "Ownership: only the caller's visits."
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/VisitStatus' }
        - name: destinationId
          in: query
          schema: { type: string }
        - name: startedAfter
          in: query
          schema: { type: string, format: date-time }
        - name: startedBefore
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Visits.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisitPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /visits/active:
    get:
      tags: [Visits]
      operationId: getActiveVisit
      summary: Current ACTIVE or PAUSED visit
      description: "Ownership: the caller's visit. `data` is null when none exists."
      responses:
        '200':
          description: Visit or null.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NullableVisitEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /visits/{visitId}:
    get:
      tags: [Visits]
      operationId: getVisit
      summary: A visit with visited landmarks and photo summaries
      description: "Ownership: another user's visit returns 404."
      parameters:
        - { $ref: '#/components/parameters/VisitId' }
      responses:
        '200':
          description: Visit detail.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisitDetailEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /visits/{visitId}/pause:
    post:
      tags: [Visits]
      operationId: pauseVisit
      summary: ACTIVE to PAUSED
      description: "Requires `Idempotency-Key`. Ownership: another user's visit returns 404."
      parameters:
        - { $ref: '#/components/parameters/VisitId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Updated visit.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisitEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /visits/{visitId}/resume:
    post:
      tags: [Visits]
      operationId: resumeVisit
      summary: PAUSED to ACTIVE
      description: "Requires `Idempotency-Key`. Ownership: another user's visit returns 404."
      parameters:
        - { $ref: '#/components/parameters/VisitId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Updated visit.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisitEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /visits/{visitId}/end:
    post:
      tags: [Visits]
      operationId: endVisit
      summary: End the visit
      description: |
        Requires `Idempotency-Key`. `ENDED` is terminal. When profile `autoJourneyAlbum` is true a PENDING recap is created
        in the same transaction; otherwise `recap` is null. Recap failure never alters the visit.
        Ownership: another user's visit returns 404.
      parameters:
        - { $ref: '#/components/parameters/VisitId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EndVisitRequest' }
      responses:
        '202':
          description: Visit ended; recap generation is asynchronous.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EndVisitEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /visits/{visitId}/landmarks/{landmarkId}:
    put:
      tags: [Visits]
      operationId: unlockVisitLandmark
      summary: Unlock a landmark with a RECOGNIZED recognition and collect its stamp
      description: |
        Idempotent. `recognitionId` must be a RECOGNIZED result for this `landmarkId` on a photo owned by the caller and
        taken in this visit, else `422 RECOGNITION_REQUIRED`. The landmark must belong to the visit's destination
        (`422 VALIDATION_ERROR`). A recognition or visit of another user returns `404`. A repeated request returns the
        existing record with `200`. Unlocked landmarks stay unlocked in later visits.
      parameters:
        - { $ref: '#/components/parameters/VisitId' }
        - { $ref: '#/components/parameters/LandmarkId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnlockLandmarkRequest' }
      responses:
        '200':
          description: Already unlocked; existing record returned.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnlockLandmarkEnvelope' }
        '201':
          description: Landmark unlocked now.
          headers: { X-Request-Id: { $ref: '#/components/headers/XRequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnlockLandmarkEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
