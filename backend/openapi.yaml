        `landmarkId` focuses one unlocked landmark; a locked or foreign landmark is `422 LANDMARK_LOCKED`. Answers come only
        from retrieved evidence with citations. Prompts, credentials and raw provider output are never exposed.
        If inference is unavailable the response is `503`; static content stays usable.
      x-rate-limit-group: AI_INFERENCE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QaRequest' }
      responses:
